name: secure-api-demo
services:
  api:
    build: .
    ports: ["127.0.0.1:${API_PORT:-8080}:8080"]
    environment:
      ISSUER_URI: http://localhost:8180/realms/backend-lab
      JWK_SET_URI: http://keycloak:8080/realms/backend-lab/protocol/openid-connect/certs
    depends_on: [keycloak]
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:${UI_PORT:-4200}:8080"]
    depends_on: [api]
  keycloak:
    image: quay.io/keycloak/keycloak:26.3.3
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: local-admin-only
    ports: ["127.0.0.1:8180:8080"]
    volumes: ["./ops/keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro"]
